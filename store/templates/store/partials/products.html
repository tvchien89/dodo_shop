{% load static %}
{% load humanize %}

<div class="container">
    <div class="row justify-content-center">
        {% for p in products %}
        <div class="col-md-3 mb-4 d-flex justify-content-center">
            <div class="card shadow">

                {% if p.image %}
                <img src="{{ p.image.url }}"
                     class="card-img-top product-img"
                     onclick="showImage(this.src)">
                {% else %}
                <img src="{% static 'images/no-image.png' %}"
                     class="card-img-top product-img">
                {% endif %}

                <!-- ✓ GIÁ ĐƯA LÊN NGAY DƯỚI ẢNH -->
                <div class="text-center text-danger fw-bold mt-2"
                     id="price-{{ p.id }}">
                    {{ p.price|intcomma }} VND
                </div>

                <!-- ======= SIZE M / L (TỰ ẨN NẾU KHÔNG CÓ) ======= -->
                {% if p.price_m or p.price_l %}
                <div class="text-center mt-2">
                    {% if p.price_m %}
                    <button class="btn btn-outline-primary btn-sm me-1"
                            onclick="selectSize({{ p.id }}, 'M', {{ p.price_m }})">
                        Size M
                    </button>
                    {% endif %}

                    {% if p.price_l %}
                    <button class="btn btn-outline-warning btn-sm"
                            onclick="selectSize({{ p.id }}, 'L', {{ p.price_l }})">
                        Size L
                    </button>
                    {% endif %}
                </div>
                {% endif %}
                <!-- ================================================= -->

                <div class="card-body text-center pt-2">
                    <h5 class="fw-bold">{{ p.name }}</h5>

                    <!-- GIỮ NGUYÊN JAVASCRIPT -->
                    <button type="button"
                            class="btn btn-success rounded-pill px-4"
                            onclick="addToCartWithSize({{ p.id }}, '{{ p.name|escapejs }}', {{ p.price }})">
                        🛒 Thêm vào giỏ
                    </button>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- ================= JAVASCRIPT THÊM SIZE ================= -->
<script>

let selectedSizes = {};
let selectedPrices = {};

function selectSize(productId, size, price) {

    selectedSizes[productId] = size;
    selectedPrices[productId] = price;

    document.getElementById("price-" + productId).innerText =
        price.toLocaleString() + " VND";
}

function addToCartWithSize(id, name, defaultPrice) {

    let finalPrice = selectedPrices[id] ? selectedPrices[id] : defaultPrice;
    let size = selectedSizes[id] ? selectedSizes[id] : "";

    addToCart(id, name + (size ? " - Size " + size : ""), finalPrice);
}

</script>
