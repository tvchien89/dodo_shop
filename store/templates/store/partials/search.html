<div class="search-box text-center mb-4">
    <form method="get" class="d-flex justify-content-center">
        <input type="text"
               name="search"
               value="{{ request.GET.search }}"
               class="form-control w-50"
               placeholder="Tìm đồ uống, đồ ăn vặt...">
        <button type="submit"
                class="btn btn-success ms-2 rounded-pill">
            Tìm kiếm
        </button>
    </form>
</div>
