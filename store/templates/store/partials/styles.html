<style>

body{
    background: linear-gradient(135deg,#f8fffc,#e6fff7);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family:'Segoe UI',sans-serif;
}

.content{ flex:1; }

/* ===== BANNER ===== */
.banner-wrapper{
    text-align:center;
    margin:25px 0;
    position:relative;
    padding:0 15px;
}

.banner-wrapper img{
    width:100%;
    max-width:260px;
    border-radius:30px;
    box-shadow:0 25px 60px rgba(0,0,0,0.18);
    transition:0.4s;
}

.banner-wrapper img:hover{
    transform:scale(1.05);
}

/* ===== DANH MỤC ===== */
.top-left-box{
    position:absolute;
    top:15px;
    left:15px; /* 🔥 DỊCH SÁT TRÁI HƠN (không còn che marquee) */
    z-index:5;
}

.category-card{
    width:260px;
    background:white;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
    overflow:hidden;
    transition:0.3s;
}

.category-card:hover{
    transform:translateY(-5px);
}

.category-header{
    background:linear-gradient(135deg,#00c9a7,#00e4d0);
    color:white;
    font-weight:600;
    padding:15px;
    text-align:center;
    font-size:16px;
}

.category-list{
    list-style:none;
    padding:12px 0;
    margin:0;
}

.category-item{
    display:block;
    padding:12px 22px;
    text-decoration:none;
    color:#333;
    font-weight:500;
    transition:0.3s;
}

.category-item:hover{
    background:#f2fffb;
    padding-left:30px;
    color:#00b894;
}

.divider{
    height:1px;
    background:#eee;
    margin:8px 15px;
}

.all-item{
    font-weight:600;
    color:#00b894;
}

/* ===== LOGIN + GIỎ ===== */
.top-right-box{
    position:absolute;
    top:15px;
    right:5%;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.shopee-cart{
    position:relative;
    cursor:pointer;
    padding:8px;
    transition:0.3s;
}

.shopee-cart:hover{
    transform:scale(1.15);
}

.cart-badge{
    position:absolute;
    top:-6px;
    right:-8px;
    background:#ff3b3b;
    color:white;
    font-size:11px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:50%;
}

/* ===== ORDER BADGE (SỐ ĐƠN MỚI) ===== */
.order-badge{
    position:absolute;
    top:-8px;
    right:-15px;
    background:red;
    color:white;
    font-size:11px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:50%;
    min-width:20px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
}

/* ===== MARQUEE ===== */
.nav-marquee{
    background:linear-gradient(135deg,#00c9a7,#00e4d0);
    padding:12px;
    border-radius:20px;
    margin-bottom:20px;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    z-index:1; /* 🔥 đảm bảo nằm dưới danh mục */
}

.nav-marquee span{
    display:inline-block;
    padding-left:100%;
    animation:marquee 15s linear infinite;
    font-weight:600;
    color:white;
}

@keyframes marquee{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
}

/* ===== SEARCH ===== */
.search-box{
    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

/* ===== CARD SẢN PHẨM ===== */
.card{
    border:none;
    border-radius:25px;
    overflow:hidden;
    transition:0.35s;
    box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 25px 60px rgba(0,0,0,0.15);
}

.product-img{
    height:170px;
    object-fit:cover;
    transition:0.4s;
}

.product-img:hover{
    transform:scale(1.08);
}

.card-body{
    padding:20px;
}

.card-body h5{
    font-weight:600;
}

.card-body .btn{
    background:linear-gradient(135deg,#00c9a7,#00e4d0);
    border:none;
    font-weight:600;
    padding:8px 25px;
    transition:0.3s;
}

.card-body .btn:hover{
    transform:scale(1.05);
    box-shadow:0 10px 25px rgba(0,201,167,0.4);
}

/* ===== MODAL ===== */
.modal-content{
    border-radius:25px;
    border:none;
}

.modal-header{
    background:linear-gradient(135deg,#00c9a7,#00e4d0);
    color:white;
    border-top-left-radius:25px;
    border-top-right-radius:25px;
}

.modal-footer .btn-success{
    background:linear-gradient(135deg,#00c9a7,#00e4d0);
    border:none;
}

/* ===== MOBILE FIX ===== */
@media (max-width:768px){

    .top-left-box,
    .top-right-box{
        position:static !important;   /* 🔥 BỎ absolute */
        transform:none !important;
        margin-bottom:15px;
        display:flex;
        justify-content:center;
    }

    .category-card{
        width:100%;
        max-width:320px;
    }

    .banner-wrapper{
        margin-top:10px;
    }

    .search-box{
        padding:15px;
    }

}

</style>
