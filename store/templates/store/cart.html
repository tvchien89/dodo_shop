<!DOCTYPE html>
<html>
<head>
    <title>Giỏ hàng - Đô Đô</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
            font-family:'Segoe UI', sans-serif;
        }

        .cart-container{
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .cart-item{
            border-bottom:1px solid #eee;
            padding:15px 0;
        }

        .cart-item img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:10px;
        }

        .qty-btn{
            width:30px;
            height:30px;
            border:none;
            background:#28a745;
            color:white;
            border-radius:5px;
        }

        .total-box{
            background:#f8f9fa;
            padding:20px;
            border-radius:10px;
        }

        .checkout-btn{
            background:#ee4d2d;
            color:white;
            font-weight:bold;
            padding:12px 30px;
            border:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="cart-container">

    <h3 class="mb-4">🛒 Giỏ hàng của bạn</h3>

    {% if cart_items %}
        {% for item in cart_items %}
        <div class="cart-item row align-items-center">

            <div class="col-md-2">
                <img src="{{ item.product.image.url }}">
            </div>

            <div class="col-md-4">
                <strong>{{ item.product.name }}</strong>
            </div>

            <div class="col-md-2 text-danger fw-bold">
                {{ item.product.price }} VND
            </div>

            <div class="col-md-2">
                <div class="d-flex align-items-center gap-2">
                    <a href="{% url 'store:update_cart' item.product.id -1 %}" class="qty-btn">-</a>
                    <span>{{ item.quantity }}</span>
                    <a href="{% url 'store:update_cart' item.product.id 1 %}" class="qty-btn">+</a>
                </div>
            </div>

            <div class="col-md-2 text-end">
                <a href="{% url 'store:remove_from_cart' item.product.id %}" class="text-danger">
                    Xóa
                </a>
            </div>

        </div>
        {% endfor %}

        <div class="total-box mt-4 d-flex justify-content-between align-items-center">
            <h5>Tổng tiền:</h5>
            <h4 class="text-danger fw-bold">{{ total_price }} VND</h4>
        </div>

        <div class="text-end mt-3">
            <a href="/" class="btn btn-secondary">Tiếp tục mua</a>
            <button class="checkout-btn">Đặt hàng</button>
        </div>

    {% else %}
        <p>Giỏ hàng đang trống.</p>
        <a href="/" class="btn btn-success">Quay lại mua hàng</a>
    {% endif %}

</div>

</body>
</html>
