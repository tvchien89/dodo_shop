<!-- IMAGE PREVIEW MODAL -->
<div id="imageModal" class="image-modal" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="modalImage">
</div>

<style>
.product-img{
    cursor:pointer;
    transition:0.3s;
}

.product-img:hover{
    transform:scale(1.05);
}

.image-modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    text-align:center;
}

.image-modal img{
    max-width:80%;
    max-height:80%;
    margin-top:5%;
    border-radius:12px;
}

.close-btn{
    position:absolute;
    top:20px;
    right:40px;
    font-size:40px;
    color:white;
    cursor:pointer;
}
</style>

<script>
function showImage(src){
    document.getElementById("imageModal").style.display="block";
    document.getElementById("modalImage").src=src;
}

function closeImage(){
    document.getElementById("imageModal").style.display="none";
}
</script>
